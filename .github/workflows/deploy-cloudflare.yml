name: Deploy to Cloudflare Pages

on:
  # ⚠️ CF Pages 项目 + 仓库密钥(CLOUDFLARE_API_TOKEN/ACCOUNT_ID)配好前先只手动触发,
  # 避免每次 push 都因缺 CF 配置而失败。配好后把 push 触发恢复(见 cloudflare-pages-deploy skill)。
  #   push:
  #     branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One concurrent deploy; newer runs cancel in-flight ones.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cloudflare Pages serves from the root domain, so build with base "/".
      - run: npm run build
        env:
          DEPLOY_BASE: "/"
      # NOTE: the Cloudflare Pages project + custom-domain binding are created by
      # a human (one-time) per the `cloudflare-pages-deploy` skill. This workflow
      # only needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets and
      # a Pages project named `official-website`.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=form-design-website --branch=main
